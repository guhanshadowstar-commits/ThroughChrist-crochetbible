<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crochet Bible</title>
<meta name="description" content="The Bible in English and Tamil, with a crochet picture stitched for every verse.">
<meta name="theme-color" content="#f6efe2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1815" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crochet Bible">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <a href="#/" id="appname" class="brand">Crochet Bible</a>
  <button id="langbtn" class="btn small" type="button" aria-label="Language"></button>
</header>
<main id="view"></main>
<nav id="tabs" class="tabs" aria-label="Main"></nav>

<div id="splash">
  <div class="splash-card">
    <div class="yarn" aria-hidden="true"></div>
    <h1 id="splash-msg">Loading...</h1>
    <div class="meter"><div id="splash-bar"></div></div>
    <p id="splash-note"></p>
    <button id="splash-retry" class="btn primary" type="button" hidden></button>
  </div>
</div>
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
